$kind: http-request
url: "{{base_url}}/users/tidakada"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Tes",
      "email": "tes@kerjaku.com"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 3000
