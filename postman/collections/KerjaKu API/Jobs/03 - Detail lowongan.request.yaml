$kind: http-request
url: "{{base_url}}/jobs/1"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Id = 1', () => pm.expect(pm.response.json().id).to.eql(1));
    language: text/javascript
order: 3000
