$kind: http-request
url: "{{base_url}}/jobs?search=dev"
method: GET
headers:
  Accept: application/json
queryParams:
  search: dev
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Semua judul mengandung dev', () => pm.response.json().forEach(j => pm.expect(j.title.toLowerCase()).to.include('dev')));
    language: text/javascript
order: 2000
