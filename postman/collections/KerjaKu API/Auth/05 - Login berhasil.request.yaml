$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "anggia",
      "password": "kerja123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Password tidak dikirim', () => pm.expect(pm.response.json()).to.not.have.property('password'));
    language: text/javascript
order: 1000
